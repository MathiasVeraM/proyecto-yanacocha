[pytest]
# Pruebas de integración: HTTP real contra el gateway del docker-compose.test.yml (sin mocks).
# No se ejecutan con las unitarias de 02_codigo_fuente/backend: viven en otra carpeta a propósito.
pythonpath = .
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    lento: crea muchos registros (repeticiones); se puede excluir con -m "not lento"
    requiere_docker: usa la CLI de docker (docker exec / inspect) sobre los contenedores del compose de pruebas
    destructivo: detiene contenedores; debe correr solo, sin otras pruebas en paralelo (pytest -m destructivo)
