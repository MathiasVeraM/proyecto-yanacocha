name: Integración - Pruebas con Docker Compose

# Levanta gateway + servicios + una base PostgreSQL efímera (docker-compose.test.yml) y ejecuta
# 03_pruebas/integracion por HTTP real. Solo corre en los PR hacia la rama test.
# Los secretos de la corrida (SECRET_KEY, contraseñas, administrador) se generan aquí mismo en cada
# ejecución y nunca se guardan: no hay ningún valor sensible en el repositorio ni en los secrets de GitHub.
on:
  pull_request:
    branches: [test]

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integracion:
    name: integracion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4

      - name: Generar secretos de la corrida
        run: |
          set -euo pipefail
          secret_key=$(openssl rand -hex 32)
          postgres_password=$(openssl rand -hex 16)
          admin_password=$(openssl rand -hex 12)
          admin_correo="admin.$(openssl rand -hex 4)@pruebas-yanacocha.com"
          # Se enmascaran antes de escribirlos: si algo los imprime, el log muestra ***
          echo "::add-mask::$secret_key"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$admin_password"
          {
            echo "SECRET_KEY=$secret_key"
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "ADMIN_PASSWORD=$admin_password"
            echo "ADMIN_CORREO=$admin_correo"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Las cuatro imágenes se construyen en paralelo y sus capas se guardan en la caché de GitHub Actions
      - name: Construir imágenes (en paralelo, con caché de capas)
        uses: docker/bake-action@v6
        with:
          files: 02_codigo_fuente/backend/docker-compose.test.yml
          targets: gateway,accesos,gestion-animal,actividades
          load: true
          set: |
            gateway.cache-from=type=gha,scope=integracion-gateway
            gateway.cache-to=type=gha,scope=integracion-gateway,mode=max
            accesos.cache-from=type=gha,scope=integracion-accesos
            accesos.cache-to=type=gha,scope=integracion-accesos,mode=max
            gestion-animal.cache-from=type=gha,scope=integracion-gestion-animal
            gestion-animal.cache-to=type=gha,scope=integracion-gestion-animal,mode=max
            actividades.cache-from=type=gha,scope=integracion-actividades
            actividades.cache-to=type=gha,scope=integracion-actividades,mode=max

      - name: Levantar el entorno de pruebas
        working-directory: 02_codigo_fuente/backend
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 03_pruebas/integracion/requirements-dev.txt

      - name: Instalar dependencias de las pruebas
        run: pip install -r 03_pruebas/integracion/requirements-dev.txt

      - name: Pruebas de integración (en paralelo)
        working-directory: 03_pruebas/integracion
        run: pytest -m "not destructivo" -n auto

      # Detiene y vuelve a levantar Actividades: debe correr solo, después de las demás
      - name: Pruebas destructivas (Actividades caído)
        if: ${{ !cancelled() }}
        working-directory: 03_pruebas/integracion
        run: pytest -m destructivo

      - name: Logs de los contenedores
        if: ${{ failure() }}
        working-directory: 02_codigo_fuente/backend
        run: docker compose ps -a && docker compose logs --no-color --tail=200

      - name: Destruir el entorno (siempre)
        if: ${{ always() }}
        working-directory: 02_codigo_fuente/backend
        run: docker compose down -v --remove-orphans || true
