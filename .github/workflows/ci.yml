name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/_backend-tests.yml

  sonar:
    needs: backend
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    uses: ./.github/workflows/_sonarqube.yml
    secrets: 
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  resultado:
    name: resultado
    if: always()
    needs: [backend, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Resultados
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Fallaron las pruebas del backend"; exit 1
          fi
          if [ "${{ needs.sonar.result }}" = "failure" ] || [ "${{ needs.sonar.result }}" = "cancelled" ]; then
            echo "Falló SonarQube"; exit 1
          fi